<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32-S3-CAM Face Tracker</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --accent:#00ff88; --card:#141a22; --muted:#6b7580; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--fg); margin:0; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center;
           margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  a.btn, button { background:var(--card); color:var(--fg); border:1px solid #223;
    padding:6px 12px; border-radius:6px; text-decoration:none; font-size:13px; cursor:pointer; }
  a.btn:hover, button:hover { border-color:var(--accent); color:var(--accent); }
  .wrap{ position:relative; display:inline-block; border:1px solid #333;
    max-width:100%; background:#000; }
  #v { display:block; width:100%; max-width:800px; height:auto; }
  #box { position:absolute; border:2px solid var(--accent);
    box-shadow:0 0 8px var(--accent); pointer-events:none; display:none; }
  /* 状态徽章 —— 始终可见，让用户一眼看到检测状态 */
  #badge { position:absolute; top:8px; left:8px;
    padding:4px 12px; border-radius:4px; font-size:13px; font-weight:bold;
    font-family:monospace; letter-spacing:0.5px; pointer-events:none;
    transition:background 0.2s, color 0.2s; }
  .badge-found   { background:var(--accent); color:#000; }
  .badge-search  { background:#333; color:#aaa; }
  .badge-error   { background:#c0392b; color:#fff; }
  #info { margin-top:8px; font-family:monospace; color:var(--muted); font-size:13px; }
  .stat { color:var(--accent); }
  /* 关键点圆点 */
  .kp-dot { position:absolute; width:8px; height:8px; border-radius:50%;
    pointer-events:none; display:none; transform:translate(-50%,-50%);
    box-shadow:0 0 4px currentColor; z-index:3; }
  .kp-eye  { background:#00ffff; color:#00ffff; }
  .kp-nose { background:#ffff00; color:#ffff00; }
  .kp-mouth{ background:#ff8800; color:#ff8800; }
  /* 疲劳预警 */
  #drowsy-alert { margin-top:8px; padding:8px 16px; background:#c0392b;
    color:#fff; font-weight:bold; border-radius:6px; font-size:14px;
    display:none; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:0.6; } }
  #fatigue-alert { margin-top:8px; padding:10px 16px; border-radius:6px;
    font-weight:bold; font-size:14px; display:none; }
  .fa-l1 { background:#f39c12; color:#000; }
  .fa-l2 { background:#e67e22; color:#fff; }
  .fa-l3 { background:#c0392b; color:#fff; animation:pulse 1s infinite; }
</style>
</head>
<body>
  <header>
    <h1>ESP32-S3-CAM  ·  OV5640  ·  Face Tracker</h1>
    <div>
      <a class="btn" href="/wifi">WiFi 配置</a>
      <a class="btn" href="/capture" target="_blank">抓拍</a>
    </div>
  </header>

  <div class="wrap">
    <img id="v" alt="video stream">
    <div id="badge" class="badge-search">搜索中…</div>
    <div id="box"></div>
    <div id="kp0" class="kp-dot kp-eye"></div>
    <div id="kp1" class="kp-dot kp-mouth"></div>
    <div id="kp2" class="kp-dot kp-nose"></div>
    <div id="kp3" class="kp-dot kp-eye"></div>
    <div id="kp4" class="kp-dot kp-mouth"></div>
  </div>
  <div id="info">connecting ...</div>
  <div id="drowsy-alert">疲劳警告：检测到低头/歪头</div>
  <div style="margin-top:8px;">
    <button id="ear-btn">启用精确闭眼检测 (MediaPipe)</button>
    <span id="ear-display" style="display:none; margin-left:12px; font-family:monospace; font-size:13px;">
      EAR: <b id="ear-val">--</b> <span id="eye-status">--</span>
      <span id="perclos-info" style="margin-left:12px; display:none;">
        PERCLOS: <b id="perclos-val">0.0%</b>
        <span id="baseline-status" style="color:var(--muted); margin-left:8px;">基线校准中...</span>
      </span>
    </span>
  </div>
  <div id="fatigue-alert"></div>

<script>
const img=document.getElementById('v'),
      box=document.getElementById('box'),
      badge=document.getElementById('badge'),
      info=document.getElementById('info');

// 视频帧：用 img.src 直接刷新（浏览器原生加载，最可靠）
// onload 触发下一帧请求，形成自驱动的帧循环
let frameSeq=0;
img.onload=function(){
  frameSeq++;
  window.dispatchEvent(new Event('frameReady'));
  img.src='/capture?t='+Date.now();
};
img.onerror=function(){
  setTimeout(function(){ img.src='/capture?t='+Date.now(); }, 500);
};
img.src='/capture?t='+Date.now();

// 人脸检测：独立轮询 /face API
// /capture 和 /face 都是短请求（发完即返回），不会互相阻塞
let errCount=0;
async function pollFace(){
  try{
    const r=await fetch('/face',{cache:'no-store'});
    const f=await r.json();
    errCount=0;

    if(f.valid && f.iw>0){
      const cw=img.clientWidth||f.iw, ch=img.clientHeight||f.ih;
      if(cw>0 && ch>0){
        const sx=cw/f.iw, sy=ch/f.ih;
        box.style.display='block';
        box.style.left=(f.x*sx)+'px'; box.style.top=(f.y*sy)+'px';
        box.style.width=(f.w*sx)+'px'; box.style.height=(f.h*sy)+'px';

        // 定位 5 个关键点
        if(f.kp && f.kp.length>=10){
          for(let i=0;i<5;i++){
            const dot=document.getElementById('kp'+i);
            dot.style.display='block';
            dot.style.left=(f.kp[i*2]*sx)+'px';
            dot.style.top=(f.kp[i*2+1]*sy)+'px';
          }
        }
      }
      badge.textContent='FACE  '+(f.score*100).toFixed(0)+'%';
      badge.className='badge-found';

      // 疲劳预警
      document.getElementById('drowsy-alert').style.display=f.drowsy?'block':'none';

      info.innerHTML='<span class="stat">FACE</span>  #'+f.frame+
        '  score='+f.score.toFixed(2)+
        '  roll='+(f.roll||0).toFixed(0)+'&#176;'+
        '  vr='+(f.vr||0).toFixed(2)+
        (f.drowsy?'  <span style="color:#e74c3c">DROWSY</span>':'');
    }else{
      box.style.display='none';
      for(let i=0;i<5;i++) document.getElementById('kp'+i).style.display='none';
      document.getElementById('drowsy-alert').style.display='none';
      badge.textContent='搜索中…';
      badge.className='badge-search';
      info.textContent='no face  #'+(f.frame||0);
    }
  }catch(e){
    errCount++;
    box.style.display='none';
    if(errCount>5){ badge.textContent='检测服务异常'; badge.className='badge-error'; }
    info.textContent='poll err: '+e.message;
  }
  setTimeout(pollFace,300);
}
// 心跳上报：页面打开后每 5 秒发一次，告诉 ESP32 上位机在线
setInterval(function(){ fetch('/heartbeat?t='+Date.now()).catch(function(){}); }, 5000);
fetch('/heartbeat?t='+Date.now()).catch(function(){});

pollFace();
</script>

<script type="module">
// === MediaPipe 468点精确闭眼检测 + PERCLOS 疲劳分析 ===
// 按需加载：用户点击按钮后从 CDN 加载模型（需 STA 模式有互联网）
// PERCLOS: 60秒内眼睛闭合>80%的时间占比，>8%判定疲劳（NHTSA标准）

let faceLandmarker = null;
let earEnabled = false;
let earStartTime = 0;

// --- EAR 滑动平均（5帧窗口，消除帧间抖动）---
const earRawHistory = [];
const EAR_WINDOW = 5;

// --- 个人 EAR 基线校准（启用后前30秒采集）---
const baselineSamples = [];
const BASELINE_DURATION_MS = 30000;
let personalBaseline = 0.28;
let baselineReady = false;

// --- PERCLOS 60s 滑动窗口 ---
const earTimeline = [];

// --- 闭眼持续时长状态 ---
let closedSince = 0;
let lastSentLevel = -1;

const earBtn = document.getElementById('ear-btn');
const earDisplay = document.getElementById('ear-display');
const earVal = document.getElementById('ear-val');
const eyeStatus = document.getElementById('eye-status');
const imgEl = document.getElementById('v');
const perclosInfo = document.getElementById('perclos-info');
const perclosVal = document.getElementById('perclos-val');
const baselineStatus = document.getElementById('baseline-status');
const fatigueAlert = document.getElementById('fatigue-alert');

const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d');

// EAR 计算（468点标准索引）
function calcEAR(lm) {
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const left = (d(160, 144) + d(158, 153)) / (2 * d(33, 133));
  const right = (d(385, 380) + d(387, 373)) / (2 * d(362, 263));
  return (left + right) / 2;
}

// 告警指令下发到 ESP32（蜂鸣/LED）
function dispatchAlert(level) {
  if (level === lastSentLevel) return;
  lastSentLevel = level;
  const param = level === 0 ? 'clear' : (level >= 2 ? 'danger' : 'warning');
  fetch('/alert?level=' + param).catch(function(){});
}

// 分级疲劳告警 UI（L1黄注意/L2橙疲劳/L3红危险）
function updateFatigueUI(level, durSec) {
  if (level === 0) { fatigueAlert.style.display = 'none'; return; }
  fatigueAlert.style.display = 'block';
  fatigueAlert.className = 'fa-l' + level;
  if (level === 1)
    fatigueAlert.textContent = '注意：闭眼 ' + durSec.toFixed(1) + 's';
  else if (level === 2)
    fatigueAlert.textContent = '疲劳驾驶：闭眼 ' + durSec.toFixed(1) + 's，请注意';
  else
    fatigueAlert.textContent = '！！危险：微睡眠 ' + durSec.toFixed(1) + 's，请立即停车！';
}

earBtn.onclick = async function() {
  if (!faceLandmarker) {
    earBtn.textContent = '加载模型中...';
    try {
      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');
      const fs = await vision.FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
      );
      faceLandmarker = await vision.FaceLandmarker.createFromOptions(fs, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'IMAGE',
        numFaces: 1
      });
    } catch(e) {
      earBtn.textContent = '加载失败（需互联网）';
      console.error('MediaPipe error:', e);
      return;
    }
  }
  earEnabled = !earEnabled;
  earBtn.textContent = earEnabled ? '关闭精确检测' : '启用精确闭眼检测 (MediaPipe)';
  earDisplay.style.display = earEnabled ? 'inline' : 'none';
  if (earEnabled) {
    earStartTime = Date.now();
    baselineReady = false;
    baselineSamples.length = 0;
    earTimeline.length = 0;
    earRawHistory.length = 0;
    closedSince = 0;
    lastSentLevel = -1;
    perclosInfo.style.display = 'inline';
    baselineStatus.textContent = '基线校准中...';
  } else {
    perclosInfo.style.display = 'none';
    fatigueAlert.style.display = 'none';
    dispatchAlert(0);
  }
};

// 每帧触发 EAR + PERCLOS 检测
window.addEventListener('frameReady', function() {
  if (!earEnabled || !faceLandmarker) return;
  try {
    offCanvas.width = imgEl.naturalWidth || 320;
    offCanvas.height = imgEl.naturalHeight || 240;
    offCtx.drawImage(imgEl, 0, 0);
    const res = faceLandmarker.detect(offCanvas);

    if (res.faceLandmarks && res.faceLandmarks.length > 0) {
      const rawEar = calcEAR(res.faceLandmarks[0]);

      // 1. 滑动平均滤波
      earRawHistory.push(rawEar);
      if (earRawHistory.length > EAR_WINDOW) earRawHistory.shift();
      const ear = earRawHistory.reduce(function(a,b){return a+b;},0) / earRawHistory.length;

      const now = Date.now();
      const elapsed = now - earStartTime;

      // 2. 个人基线校准（前30秒取中位数）
      if (!baselineReady) {
        if (elapsed < BASELINE_DURATION_MS) {
          baselineSamples.push(ear);
        } else if (baselineSamples.length > 10) {
          const sorted = baselineSamples.slice().sort(function(a,b){return a-b;});
          personalBaseline = sorted[Math.floor(sorted.length / 2)];
          baselineReady = true;
          baselineStatus.textContent = '基线:' + personalBaseline.toFixed(3);
        }
      }

      // 3. 闭眼判定（P80: EAR < 个人基线×0.2）
      const closedThreshold = personalBaseline * 0.2;
      const closed = ear < closedThreshold;

      earVal.textContent = ear.toFixed(3);
      eyeStatus.textContent = closed ? 'CLOSED' : 'OPEN';
      eyeStatus.style.color = closed ? '#e74c3c' : '#00ff88';

      // 4. PERCLOS（仅基线就绪后计算，60s滑动窗口）
      let perclos = 0;
      if (baselineReady) {
        earTimeline.push({t: now, ear: ear});
        while (earTimeline.length > 0 && now - earTimeline[0].t > 60000)
          earTimeline.shift();
        let closedCount = 0;
        for (let i = 0; i < earTimeline.length; i++)
          if (earTimeline[i].ear < closedThreshold) closedCount++;
        perclos = earTimeline.length > 0 ? closedCount / earTimeline.length : 0;
        perclosVal.textContent = (perclos * 100).toFixed(1) + '%';
      }

      // 5. 闭眼持续时长分级告警
      let level = 0, durSec = 0;
      if (closed) {
        if (closedSince === 0) closedSince = now;
        durSec = (now - closedSince) / 1000;
        if (durSec >= 3) level = 3;        // 危险：微睡眠
        else if (durSec >= 1) level = 2;   // 疲劳
        else if (durSec >= 0.5) level = 1; // 注意
      } else {
        closedSince = 0;
      }
      // PERCLOS 超标提升告警等级
      if (baselineReady && perclos > 0.15 && level < 2) level = 2;
      else if (baselineReady && perclos > 0.08 && level < 1) level = 1;

      updateFatigueUI(level, durSec);
      dispatchAlert(level);

    } else {
      earVal.textContent = '--';
      eyeStatus.textContent = 'no face';
      if (lastSentLevel > 0) { updateFatigueUI(0, 0); dispatchAlert(0); }
    }
  } catch(e) {}
});
</script>
</body>
</html>
