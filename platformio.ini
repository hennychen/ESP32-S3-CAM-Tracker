; PlatformIO — ESP-IDF 框架
; ESP32-S3-CAM (Type-C, N16R8) + OV5640 + ESP-DL 人脸检测 + MJPEG 推流

[platformio]
default_envs = esp32s3cam
; ESP-IDF 使用 CMakeLists.txt，源码位于 main/
src_dir = main

[env:esp32s3cam]
; --- 使用 pioarduino 社区 fork（跟进最新 ESP-IDF 5.5.x） ---
; PlatformIO 官方 platform-espressif32 已停更（最高只到 IDF 5.2.1）
; pioarduino 社区维护版本跟到 IDF 5.5.5，且兼容 ESP-DL 3.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; ---- SDK 配置文件（覆盖默认 sdkconfig） ----
board_build.embed_txtfiles =
    main/web/index.html
    main/web/wifi.html

; ---- 烧录 & 监视（USB-CDC 原生） ----
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 注意：sdkconfig 由 sdkconfig.defaults 首次编译生成，请勿手改 sdkconfig
